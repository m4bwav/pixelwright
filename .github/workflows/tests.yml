# Offline pxw.py tests and the structure checks on the three operating systems, oldest and newest Python.
name: tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.14"]
        exclude:
          - os: ubuntu-latest
            python: "3.9"
        include:
          - os: ubuntu-24.04
            python: "3.9"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --quiet numpy pillow
      - name: structure, links and guards
        run: python tests/check_skills.py
      - name: pxw.py animation tests
        run: python tests/test_pxw.py
      - name: pxw.py make tests
        run: python tests/test_make.py
